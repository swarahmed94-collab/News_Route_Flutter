name: news_route
version: 1.0.0+1
description: Figma News application in Flutter, using only supplied export assets and the documented NewsAPI.
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/cards/
    - assets/photos/
    - assets/branding/
    - assets/reference/
